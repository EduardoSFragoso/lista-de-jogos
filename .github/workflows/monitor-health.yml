# ============================================================
# Monitor de saúde — bate no /api/health do Worker a cada
# hora nos minutos 8 e 58 (UTC). O endpoint valida Worker
# e banco (Neon) de uma vez: ele roda um `select count(*)`.
#
# 5 tentativas com 20s de espera cobrem o cold start do Neon
# (compute suspende por inatividade; a primeira query falha,
# as seguintes passam).
#
# Falha no job = e-mail automático do GitHub para quem
# criou o commit mais recente da ação agendada.
#
# Observação: o agendador do GitHub pode atrasar alguns
# minutos em horários de pico; nunca pula o disparo.
# Rodar manualmente: aba Actions → Monitor de saúde → Run.
# ============================================================
name: Monitor de saúde
on:
  schedule:
    - cron: '8,58 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    name: GET /api/health
    runs-on: ubuntu-latest
    steps:
      - name: Verifica Worker + Neon
        run: |
          body=""
          for i in 1 2 3 4 5; do
            if body=$(curl -sS --max-time 15 https://lista-api.eduardosfragoso.workers.dev/api/health) &&
               echo "$body" | grep -q '"ok":true'; then
              echo "Resposta: $body"
              exit 0
            fi
            echo "Tentativa $i: ${body:-sem resposta}; repetindo em 20s"
            sleep 20
          done
          echo "Falhou após 5 tentativas. Última resposta: $body"
          exit 1

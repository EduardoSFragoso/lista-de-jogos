# ============================================================
# Monitor de saúde — bate no /api/ping do Worker a cada hora
# nos minutos 8 e 58 (UTC). Rota sem banco de propósito:
# o Neon suspende o compute por inatividade (scale-to-zero)
# e o monitor não deve ser o motivo de ele acordar. /api/health
# continua existindo para checagem manual com banco.
#
# 5 tentativas com 20s de espera cobrem blips de rede e
# redeploy do Worker.
#
# Falha no job = e-mail automático do GitHub para quem
# criou o commit mais recente da ação agendada.
#
# Observação: o agendador do GitHub pode atrasar alguns
# minutos em horários de pico; nunca pula o disparo.
# Rodar manualmente: aba Actions → Monitor de saúde → Run.
# ============================================================
name: Monitor de saúde
on:
  schedule:
    - cron: '8,58 * * * *'
  workflow_dispatch:
    inputs:
      simular_falha:
        description: 'Falha de propósito, para provar o alerta (Issue) no GitHub real'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ping:
    name: GET /api/ping
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write # SÓ o job: cria/comenta/fecha a Issue de alerta
    steps:
      # o checkout é necessário para rodar tools/alerta-falha.mjs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verifica Worker
        run: |
          if [ "${{ inputs.simular_falha }}" = "true" ]; then
            echo "simular_falha=true: falhando de propósito (prova do alerta)"
            exit 1
          fi
          for i in 1 2 3 4 5; do
            if body=$(curl -sS --max-time 15 https://lista-api.eduardosfragoso.workers.dev/api/ping) &&
               echo "$body" | grep -q '"ok":true'; then
              echo "Resposta: $body"
              exit 0
            fi
            echo "Tentativa $i: ${body:-sem resposta}; repetindo em 20s"
            sleep 20
          done
          echo "Falhou após 5 tentativas. Última resposta: $body"
          exit 1
      # Issue automática de falha (ver tools/alerta-falha.mjs). O
      # monitor roda a cada 30 min: com Issue já aberta, NÃO comenta
      # (ALERTA_SEM_COMENTARIO=1) para não encher a Issue de ruído.
      - name: Alerta — falhou
        if: failure() && github.event_name != 'pull_request'
        run: node tools/alerta-falha.mjs falhou
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERTA_SEM_COMENTARIO: '1'
      - name: Alerta — passou
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true # erro ao fechar a Issue não derruba o run
        run: node tools/alerta-falha.mjs passou
        env:
          GITHUB_TOKEN: ${{ github.token }}

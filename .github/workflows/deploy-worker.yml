# Deploy do Worker no Cloudflare a cada push que mexer nele.
# Requer os secrets em
# https://github.com/EduardoSFragoso/lista-de-jogos/settings/secrets/actions
#   CLOUDFLARE_API_TOKEN  — perfil → API Tokens → "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID — painel Workers & Pages (lado direito)
# Deploy manual também: aba Actions → deploy-worker → Run workflow
# (ou `cd worker && npm run deploy` na máquina local).

name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/src/**'
      - 'worker/wrangler.toml'
      - 'worker/package.json'
      - 'worker/package-lock.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Wrangler deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# Deploy do GitHub Pages: publica SOMENTE o frontend.
# O resto do repositório (worker/, docs/, dumps) deixa de ficar
# acessível por URL no domínio do Pages.
name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - data/games.json
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # monta só o necessário para o site funcionar
      - name: Monta o pacote do frontend
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/
          cp data/games.json _site/data/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

# Deploy do GitHub Pages: publica SOMENTE o frontend.
# O resto do repositório (worker/, docs/, dumps) deixa de ficar
# acessível por URL no domínio do Pages.
name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - data/games.json
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # monta só o necessário para o site funcionar
      - name: Monta o pacote do frontend
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/
          cp data/games.json _site/data/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

      # O artefato (~120 MB de capas/thumbs) finaliza no blob storage
      # antes de aparecer no índice consultado pelo deploy-pages —
      # lag de consistência do backend de artefatos. A espera evita
      # "No artifacts named github-pages".
      - name: Espera o índice de artefatos
        run: sleep 30

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

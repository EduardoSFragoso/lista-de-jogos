# Sobe data/games.json pro Neon automaticamente em todo push
# que alterar os dados. Requer o secret DATABASE_URL em
# https://github.com/EduardoSFragoso/lista-de-jogos/settings/secrets/actions
# Rodar também manualmente: aba Actions → sync-neon → Run workflow.

name: sync-neon

on:
  push:
    branches: [main]
    paths:
      - 'data/games.json'
      - 'worker/sync-db.mjs'
      - '.github/workflows/sync-neon.yml'
  workflow_dispatch:

concurrency:
  group: sync-neon-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: node sync-db.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

name: Lint e formatação

on:
  push:
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: ESLint + Stylelint + Prettier + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar formatação (Prettier)
        run: npx prettier --check .

      - name: Lint de JavaScript (ESLint)
        run: npx eslint .

      - name: Lint de CSS (Stylelint)
        run: npx stylelint "assets/css/**/*.css"

      - name: Testes (vitest)
        run: npm test

# ============================================================
# lista-api — configuração do Cloudflare Worker
# Deploy: npx wrangler deploy   (após `npx wrangler login`)
# Secrets (não ficam neste arquivo): DATABASE_URL e ADMIN_PASSWORD
#          npx wrangler secret put DATABASE_URL
#          npx wrangler secret put ADMIN_PASSWORD
# ============================================================

name = "lista-api"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
# Origem do front (GitHub Pages) enviada no header CORS.
ALLOWED_ORIGIN = "https://eduardosfragoso.github.io"

# ------------------------------------------------------------------
# Capas dos jogos em R2 (bucket público via Worker, key = "<id>.jpg").
# Criar uma vez: npx wrangler r2 bucket create lista-covers
# Upload manual: npx wrangler r2 object put lista-covers/12.jpg --file capa.jpg --remote
# ------------------------------------------------------------------
[[r2_buckets]]
binding = "COVERS"
bucket_name = "lista-covers"

# ------------------------------------------------------------------
# Hyperdrive: OPCIONAL neste projeto. O driver @neondatabase/serverless
# conecta ao Neon por HTTP/fetch, sem TCP, então não passa pelo
# Hyperdrive. Só descomente (e crie o pool com `npx wrangler
# hyperdrive create`) se trocar para o driver node-postgres/TCP.
# ------------------------------------------------------------------
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<id-do-hyperdrive>"

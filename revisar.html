<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisar lista — Lista de Jogos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230f0f23'/%3E%3Crect x='3' y='6' width='4' height='4' fill='%23f7d51d'/%3E%3Crect x='9' y='6' width='4' height='4' fill='%23f04e68'/%3E%3C/svg%3E">
</head>
<body>
  <div class="crt" aria-hidden="true"></div>

  <header class="hero">
    <h1>REVISAR LISTA</h1>
    <p class="subtitle">jogos com &quot;_obs&quot; (pergunta / suposição da IA) ou sem metadados</p>

    <div class="controls">
      <input type="search" id="search" placeholder="Buscar jogo...">
      <button id="copy" type="button">COPIAR RESPOSTAS</button>
    </div>
    <p class="count">Responda no campo de cada card e clique em COPIAR RESPOSTAS. Cole o texto aqui no chat que eu atualizo o <code>games.json</code> e faço o push.</p>
  </header>

  <main>
    <ul id="review-list" class="game-list" aria-live="polite"></ul>
  </main>

  <footer class="footer">
    <p>página só para revisão — não faz parte do site</p>
  </footer>

  <script src="assets/js/revisar.js"></script>
</body>
</html>

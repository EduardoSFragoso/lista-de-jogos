<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="pageTitle">Lista de Jogos</title>
    <meta
      name="description"
      data-i18n-content="pageDescription"
      content="A lista de jogos que eu já joguei."
    />
    <!-- Fontes: Orbitron (títulos neon), Inter (leitura), JetBrains Mono (dados) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230f0f23'/%3E%3Crect x='3' y='6' width='4' height='4' fill='%2371d95c'/%3E%3Crect x='9' y='6' width='4' height='4' fill='%23f04e68'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- Efeito de scanlines CRT por cima de tudo -->

    <header class="hero">
      <p class="blink" aria-hidden="true">▸</p>
      <h1 data-i18n="title">LISTA DE JOGOS</h1>
      <p class="subtitle" data-i18n="subtitle">os jogos que eu já joguei</p>

      <div class="controls">
        <input
          type="search"
          id="search"
          data-i18n-placeholder="search"
          placeholder="Buscar jogo..."
        />
        <button id="lang-toggle" type="button" aria-label="Switch language">EN</button>
        <button id="publish" type="button" class="btn-ghost">
          <span data-i18n="publish">PUBLICAR NO GITHUB</span>
        </button>
        <button id="gh-config" type="button" class="btn-ghost" aria-label="Configuração do GitHub">
          ⚙
        </button>
      </div>

      <p id="publish-status" class="count"></p>
      <nav id="letter-nav" class="letter-nav" aria-label="Índice A-Z"></nav>

      <p id="count" class="count"></p>
    </header>

    <main>
      <ul id="game-list" class="game-list" aria-live="polite"></ul>
      <noscript>
        <p class="noscript" data-i18n="noscript">
          Ative o JavaScript para ver a lista. A versão em texto puro está em
          <code>data/games.json</code>.
        </p>
      </noscript>
    </main>

    <footer class="footer">
      <p data-i18n="footer">feito com muito tempo de tela</p>
      <p><a class="footer-link" href="revisar.html" data-i18n="reviewLink">revisar a lista</a></p>
    </footer>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
